<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Portfolio Serigne Ndiaye – Frontend Developer & Multimédia</title>
  <meta name="description" content="Portfolio de Serigne Ndiaye, étudiant en L3 MIC spécialisé en développement web, intégration IA et édition vidéo. Découvrez mes projets HTML, CSS, JS, React et CapCut.">
  <meta name="keywords" content="Frontend Developer, Portfolio, HTML, CSS, JavaScript, React, GSAP, CapCut, Montage Vidéo, IA Web Development">
  <meta name="author" content="Serigne Ndiaye">
  <style>
    html {
  scroll-behavior: smooth;
}

body {
  font-family: Segoe UI, Tahoma, sans-serif;
  margin: 0;
  background: linear-gradient(-45deg, #0a0a0a, #111, #222, #0a0a0a);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.5s, color 0.5s;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Mode sombre inversé (Theme clair) */
body.dark {
  background: linear-gradient(-45deg, #fdfdfd, #f5f5f5, #eaeaea, #fdfdfd);
  color: #222;
}
body.dark nav { background-color: rgba(255,255,255,0.9); }
body.dark nav .logo { color: #0077cc; }
body.dark nav ul li a { color: #444; }
body.dark nav ul li a:hover { color: #0077cc; }
body.dark .hero h1 { color: #0077cc; }
body.dark .hero p { color: #555; }
body.dark .hero button { background-color: #0077cc; color: #fff; }
body.dark .hero button:hover { background-color: #005fa3; }
body.dark .project, body.dark .video-card { background: rgba(255,255,255,0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
body.dark .project p, body.dark .video-card p { color: #333; }
body.dark .project h3, body.dark .video-card h3 { color: #0077cc; }
body.dark #contact-form input,
body.dark #contact-form textarea { background: rgba(255,255,255,0.9); color: #222; border-color: #0077cc; }
body.dark #contact-form button { background-color: #0077cc; color: #fff; }
body.dark #contact-form button:hover { background-color: #005fa3; }
body.dark .skills, body.dark .videos-section { background: #f5f5f5; color: #222; }
body.dark .timeline { border-left-color: #0077cc; }
body.dark .timeline-item h3 { color: #0077cc; }
body.dark .timeline-item p { color: #555; }

/* Navbar */
nav {
  background-color: rgba(0,0,0,0.7);
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}
nav .logo {
  color: #00ff88;
  font-size: 22px;
  font-weight: bold;
  transition: color 0.3s ease;
}
nav ul {
  list-style: none;
  display: flex;
  margin: 0;
  padding: 0;
}
nav ul li { margin-left: 20px; }
nav ul li a {
  text-decoration: none;
  color: #ccc;
  font-size: 18px;
  transition: color 0.3s ease;
}
nav ul li a:hover { color: #00ff88; }
nav ul li button {
  background: none;
  border: 1px solid #00ff88;
  color: #00ff88;
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 5px;
  transition: background 0.3s, color 0.3s, transform 0.2s;
}
nav ul li button:hover {
  background: #00ff88;
  color: #000;
  transform: scale(1.05);
}

/* Burger menu */
.burger { display: none; cursor: pointer; }
.burger div {
  width: 25px; height: 3px;
  background-color: #00ff88;
  margin: 5px;
  transition: all 0.3s ease;
}

/* Hero Section */
.hero {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center;
  padding: 80px 20px;
}
.hero h1 {
  color: #00ff88;
  font-size: 48px;
  margin: 0 0 20px 0;
  transition: color 0.3s ease;
}
.hero p {
  color: #ccc;
  font-size: 20px;
  margin: 0 0 20px 0;
}
.hero button {
  background-color: #00ff88;
  border: none;
  padding: 12px 24px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 5px;
  transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
}
.hero button:hover {
  background-color: #00cc66;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,255,136,0.6);
}

/* About Section */
.about {
  padding: 60px 20px;
  text-align: center;
}
.about h2 {
  color: var(--accent-color, #00ff88);
  font-size: 36px;
  margin-bottom: 40px;
}
.about-container {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 30px;
  max-width: 900px;
  margin: auto;
}
.about-container img {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 8px 20px rgba(0,255,136,0.3);
}
.about-text {
  max-width: 500px;
  text-align: left;
  color: #ccc;
  font-size: 18px;
  line-height: 1.6;
}

/* Skills Section & Timeline */
.skills {
  padding: 60px 20px;
  background: #0a0a0a;
  color: #eee;
  text-align: center;
}
.skills h2 {
  color: var(--accent-color, #00ff88);
  font-size: 36px;
  margin-bottom: 40px;
}
.timeline {
  max-width: 800px;
  margin: auto;
  position: relative;
  padding-left: 20px;
  border-left: 3px solid var(--accent-color, #00ff88);
  text-align: left;
}
.timeline-item {
  margin-bottom: 30px;
  position: relative;
}
.timeline-item h3 {
  font-size: 20px;
  color: var(--accent-color, #00ff88);
  margin: 0 0 5px 0;
}
.timeline-item p {
  color: #ccc;
  margin: 0;
  font-size: 16px;
}

/* Projects Section */
.projects {
  padding: 60px 20px;
  text-align: center;
}
.projects h2 {
  color: var(--accent-color, #00ff88);
  font-size: 36px;
  margin-bottom: 40px;
}
.project-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}
.project {
  background: rgba(0,0,0,0.6);
  padding: 25px;
  border-radius: 12px;
  transition: transform 0.3s, box-shadow 0.3s;
  cursor: pointer;
}
.project:hover {
  transform: translateY(-8px);
  box-shadow: 0 8px 20px rgba(0,255,136,0.3);
}
.project h3 {
  color: var(--accent-color, #00ff88);
  margin-bottom: 15px;
  font-size: 22px;
}
.project p {
  color: #ccc;
  margin-bottom: 15px;
  font-size: 16px;
}
.project a {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 16px;
  background: var(--accent-color, #00ff88);
  color: #000;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  transition: background 0.3s, transform 0.2s;
}
.project a:hover {
  background: #00cc66;
  transform: scale(1.05);
}
.project img {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 15px;
}

/* Videos / CapCut Section */
.videos-section {
  padding: 60px 20px;
  background: #0a0a0a;
  text-align: center;
}
.videos-section h2 {
  color: var(--accent-color, #00ff88);
  font-size: 36px;
  margin-bottom: 20px;
}
.videos-section .intro-video {
  max-width: 700px;
  margin: 0 auto 40px auto;
  color: #ccc;
  font-size: 18px;
  line-height: 1.6;
}
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  max-width: 1000px;
  margin: 0 auto;
}
.video-card {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  text-align: center;
}
.video-card h3 {
  color: #00ff88;
  margin-bottom: 15px;
  font-size: 20px;
}
.video-card p {
  color: #ccc;
  font-size: 15px;
  margin-top: 12px;
}

/* Contact Section */
.contact { padding: 40px; text-align: center; }
.contact h2 {
  color: var(--accent-color, #00ff88);
  font-size: 36px;
  margin-bottom: 20px;
}
#contact-form {
  display: flex; flex-direction: column;
  align-items: center; gap: 15px;
  max-width: 500px; margin: 0 auto;
}
#contact-form input,
#contact-form textarea {
  width: 100%; padding: 12px;
  border: 1px solid #00ff88;
  border-radius: 5px;
  background: rgba(0,0,0,0.6);
  color: #fff;
}
#contact-form button {
  background-color: var(--accent-color, #00ff88);
  border: none; padding: 12px 24px;
  font-size: 18px; cursor: pointer;
  border-radius: 5px;
  transition: background-color 0.3s, transform 0.2s;
}
#contact-form button:hover {
  background-color: #00cc66;
  transform: scale(1.05);
}

.mockup {
  border: 12px solid #111;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,255,136,0.3);
}
.mockup img {
  width: 100%;
  height: auto;
  display: block;
}

/* Responsive */
@media (max-width: 768px) {
  nav ul { flex-direction: column; align-items: center; }
  .hero h1 { font-size: 32px; }
  .project-list, .video-grid { grid-template-columns: 1fr; }
  .nav-links {
    display: none; flex-direction: column;
    background: #111;
    position: absolute; top: 60px; right: 0;
    width: 220px; padding: 20px;
    border-radius: 0 0 10px 10px;
  }
  .nav-links.active {
    display: flex;
    animation: slideIn 0.4s ease forwards;
  }
  .burger { display: block; }
}
@media (max-width: 480px) {
  nav .logo { font-size: 18px; }
  .hero h1 { font-size: 24px; }
  .hero p { font-size: 16px; }
  .hero button { font-size: 16px; padding: 10px 20px; }
  .project, .video-card { width: 90%; margin: 0 auto; }
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Footer */
footer {
  background: #111;
  color: #eee;
  text-align: center;
  padding: 20px 0;
  margin-top: 40px;
}
.footer-container { max-width: 1200px; margin: auto; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">Serigne Ndiaye</div>
    <div class="burger">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <ul class="nav-links">
      <li><a href="#about">À propos</a></li>
      <li><a href="#skills">Parcours</a></li>
      <li><a href="#projects">Projets Web</a></li>
      <li><a href="#videos">Créations Vidéo</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><button onclick="document.body.classList.toggle('dark')">🌙/☀</button></li>
    </ul>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h1>Salut, je suis Serigne Fallou Ndiaye</h1>
    <p>Étudiant MIC en 3ème année. Je code, j'intègre l'IA et je crée du contenu multimédia.</p>
